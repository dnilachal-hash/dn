version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hmc-payroll-db
    environment:
      POSTGRES_DB: payroll_db
      POSTGRES_USER: payroll_user
      POSTGRES_PASSWORD: PayrollDB_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll_user -d payroll_db"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: hmc-payroll-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://payroll_user:PayrollDB_2024@postgres:5432/payroll_db
      SECRET_KEY: change_me_to_long_random_64_char_string_in_production_environment_xxx
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data:/app/data
    restart: unless-stopped

volumes:
  pgdata:
  app_data:
